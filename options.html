<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Title Tweaker 规则配置</title>
    <link href="layui.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #f8f8f8;
            font-family: system-ui, -apple-system, Segoe UI, Roboto;
            overflow-x: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 900px;
            padding: 32px 16px;
        }

        .card {
            width: 100%;
            max-width: 100%;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            padding: 16px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        h2 {
            margin: 0 0 16px;
            text-align: center;
        }

        .layui-form select {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .layui-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 6px 24px 6px 10px;
            border: 1px solid #d2d2d2;
            border-radius: 4px;
            background: #fff;
            font-size: 14px;
            width: 100%;
            max-width: 100%;
            background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='%23999' d='M0 0l5 6 5-6z'/></svg>") no-repeat right 10px center;
            background-size: 10px 6px;
        }

        .layui-select:focus {
            border-color: #16b777;
            outline: none;
        }

        .layui-input {
            width: 100%;
            max-width: 100%;
        }

        .layui-btn {
            width: 100%;
            padding: 0;
        }

        table.layui-table {
            width: 100%;
            max-width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        table.layui-table th,
        table.layui-table td {
            border: 1px solid #e6e6e6;
            padding: 8px;
            white-space: normal;
            word-break: break-all;
            overflow-wrap: anywhere;
            vertical-align: middle;
        }

        table.layui-table th {
            background: #fafafa;
            font-weight: 600;
            text-align: center;
            vertical-align: middle;
        }

        table.layui-table th:nth-child(1),
        table.layui-table td:nth-child(1) {
            width: 90px;
        }

        table.layui-table th:nth-child(5),
        table.layui-table td:nth-child(5) {
            width: 80px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .wrap {
                padding: 20px 12px;
            }

            .card {
                padding: 12px;
            }

            table.layui-table {
                min-width: 720px;
            }
        }

        .form-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-item {
            width: 100%;
        }

        .form-item label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-item .layui-input,
        .form-item .layui-select {
            width: 100%;
        }

        .form-item .layui-btn {
            width: 100%;
        }
    </style>
</head>

<body>
<div class="wrap">
    <h2>规则管理</h2>

    <div class="card">
        <div class="layui-form form-column">

            <div class="form-item">
                <label>匹配类型</label>
                <select id="type" class="layui-select">
                    <option value="match">match（通配）</option>
                    <option value="regex">regex（正则）</option>
                </select>
            </div>

            <div class="form-item">
                <label>匹配模式</label>
                <input
                        id="pattern"
                        type="text"
                        placeholder="如：https://www.qidian.com/chapter/*"
                        class="layui-input"
                >
            </div>

            <div class="form-item">
                <label>页面标题</label>
                <input
                        id="title"
                        type="text"
                        placeholder="设置的标题"
                        class="layui-input"
                >
            </div>

            <div class="form-item">
                <label>图标 URL</label>
                <input
                        id="icon"
                        type="text"
                        placeholder="图标 URL（可选）"
                        class="layui-input"
                >
            </div>

            <div class="form-item">
                <button id="add" type="button" class="layui-btn layui-btn-normal">
                    添加规则
                </button>
            </div>

        </div>
    </div>

    <div class="card">
        <div class="layui-form">
            <table class="layui-table" id="list">
                <thead>
                <tr>
                    <th>类型</th>
                    <th>地址</th>
                    <th>标题</th>
                    <th>图标</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="options.js" defer></script>
</body>
</html>
